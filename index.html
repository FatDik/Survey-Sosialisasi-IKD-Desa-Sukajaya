<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kuesioner Penelitian – Sosialisasi IKD</title>
<link rel="icon" id="favicon" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #1B3A6B; --green: #2DB67D; --bg: #F8FAFC;
    --ink: #1E293B; --muted: #475569; --line: #E2E8F0; --err: #EF4444;
  }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
  button { font-family: inherit; }
  [hidden] { display: none !important; }

  /* Top bar + progress */
  .topbar { position: sticky; top: 0; z-index: 10; background: var(--navy); padding: 0 24px; }
  .topbar-row { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; }
  .brand { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 700; font-size: 15px; }
  .logo { width: 40px; height: 40px; border-radius: 50%; object-fit: contain; flex-shrink: 0; }
  .cover-logo { display: block; width: 112px; height: 112px; margin: 0 auto 18px; object-fit: contain; }
  .cover { text-align: center; }
  .count { color: var(--green); font-weight: 700; font-size: 14px; white-space: nowrap; }
  .bar { height: 4px; background: rgba(255,255,255,.1); }
  .bar > div { height: 100%; width: 0; background: var(--green); transition: width .4s ease; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 20px 56px; }

  /* Cards */
  .card { background: #fff; border-radius: 16px; padding: 24px 28px; box-shadow: 0 2px 8px rgba(0,0,0,.05); border: 2px solid transparent; margin-bottom: 16px; transition: border-color .2s; }
  .card.error { border-color: var(--err); }

  .cover { background: var(--navy); color: #fff; border-radius: 20px; padding: 32px 28px; }
  .cover .tag { display: inline-block; background: rgba(45,182,125,.15); border: 1px solid rgba(45,182,125,.3); color: var(--green); border-radius: 20px; padding: 5px 14px; font-size: 12px; font-weight: 600; letter-spacing: .5px; margin-bottom: 16px; }
  .cover h1 { font-size: clamp(24px, 5vw, 32px); font-weight: 800; letter-spacing: -.5px; line-height: 1.15; margin-bottom: 6px; }
  .cover .sub { color: var(--green); font-weight: 600; font-size: 16px; margin-bottom: 14px; }
  .cover p { color: rgba(255,255,255,.75); font-size: 14px; line-height: 1.7; }
  .cover .req-note { margin-top: 12px; font-size: 13px; color: rgba(255,255,255,.55); }

  .sec-head { background: var(--navy); color: #fff; border-radius: 16px; padding: 22px 28px; }
  .sec-head .eyebrow { font-size: 12px; font-weight: 600; color: var(--green); letter-spacing: .4px; margin-bottom: 6px; }
  .sec-head h2 { font-size: 22px; font-weight: 800; letter-spacing: -.4px; }
  .sec-head p { margin-top: 6px; font-size: 14px; opacity: .75; }

  .info { background: #EFF6FF; border-color: #BFDBFE; }
  .info h3 { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
  .info p { font-size: 14px; color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .legend span { background: #fff; border: 1px solid #BFDBFE; border-radius: 8px; padding: 4px 10px; font-size: 12.5px; color: var(--ink); }
  .legend b { color: var(--navy); }

  /* Question */
  .q-top { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 18px; }
  .num { background: var(--navy); color: #fff; border-radius: 8px; min-width: 28px; height: 28px; padding: 0 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; margin-top: 1px; }
  .q-text { font-size: 15px; font-weight: 500; line-height: 1.6; }
  .req { color: var(--err); }
  .err-msg { margin-top: 12px; color: var(--err); font-size: 13px; font-weight: 600; }

  /* Pilihan identitas (radio list) */
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice { display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 11px 14px; border: 2px solid var(--line); border-radius: 10px; font-size: 15px; transition: border-color .15s, background .15s; }
  .choice:hover { border-color: var(--navy); }
  .choice input { accent-color: var(--navy); width: 18px; height: 18px; flex-shrink: 0; }
  .choice:has(input:checked) { border-color: var(--navy); background: #F1F5F9; }
  .other { margin-top: 10px; display: none; }
  .other.show { display: block; }
  .other input { width: 100%; padding: 11px 14px; border: 2px solid var(--line); border-radius: 10px; font-size: 15px; font-family: inherit; outline: none; }
  .other input:focus { border-color: var(--navy); }

  /* Skala Likert */
  .likert { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .likert label { position: relative; cursor: pointer; display: block; }
  .likert input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .tile { display: block; height: 100%; border: 2px solid var(--line); border-radius: 10px; padding: 10px 4px; text-align: center; font-size: 11px; color: var(--muted); line-height: 1.3; transition: all .15s; }
  .tile b { display: block; font-size: 16px; font-weight: 800; margin-bottom: 2px; color: var(--ink); }
  .likert label:hover .tile { border-color: var(--navy); }
  .likert input:checked + .tile { background: var(--navy); border-color: var(--navy); color: #fff; }
  .likert input:checked + .tile b { color: #fff; }
  .likert input:focus-visible + .tile { outline: 3px solid rgba(45,182,125,.55); outline-offset: 2px; }
  @media (max-width: 560px) {
    .card, .sec-head, .cover { padding-left: 20px; padding-right: 20px; }
    .likert { grid-template-columns: 1fr; gap: 6px; }
    .tile { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; font-size: 14px; }
    .tile b { display: inline-block; margin: 0; min-width: 36px; font-size: 15px; }
  }

  /* Navigasi */
  .nav { display: flex; gap: 12px; margin-top: 24px; }
  .btn { flex: 1; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; border: 2px solid transparent; transition: opacity .15s; }
  .btn-ghost { background: #fff; border-color: var(--line); color: var(--ink); }
  .btn-primary { flex: 2; background: var(--navy); color: #fff; }
  .btn-submit { flex: 2; background: var(--green); color: #fff; }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .step { text-align: center; margin-top: 14px; font-size: 13px; color: #94A3B8; }
  .submit-err { margin-top: 14px; background: #FEF2F2; border: 1px solid #FCA5A5; color: #B91C1C; border-radius: 10px; padding: 12px 16px; font-size: 13.5px; }

  /* Terima kasih */
  .thanks { text-align: center; padding: 48px 28px; }
  .thanks .ok { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%; background: #E8F9F2; color: var(--green); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; }
  .thanks h2 { font-size: 24px; font-weight: 800; color: var(--navy); margin-bottom: 8px; }
  .thanks p { color: var(--muted); font-size: 15px; margin-bottom: 24px; }
  .thanks .btn { flex: none; padding: 12px 24px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="brand"><img class="logo" id="logo-top" alt="Logo Sosialisasi IKD Desa Sukajaya"><span>Kuesioner Penelitian</span></div>
    <span class="count" id="count"></span>
  </div>
  <div class="bar"><div id="bar"></div></div>
</div>

<main class="wrap">
  <div id="content"></div>
  <div id="thanks" class="card thanks" hidden>
    <div class="ok">✓</div>
    <h2>Terima kasih!</h2>
    <p>Jawaban Anda telah terkirim. Partisipasi Anda sangat berarti bagi penelitian ini.</p>
    <button class="btn btn-ghost" onclick="resetForm()">Isi formulir lagi</button>
  </div>
</main>

let _n = 0;
GROUPS.forEach(g => { g.items = g.items.map(text => ({ id: 'p' + (++_n), no: _n, text })); });
const TOTAL_Q = IDENTITY.length + _n;

const SECTIONS = [{ type: 'identity' }].concat(GROUPS.map((group, gi) => ({ type: 'likert', group, gi })));

// ===== STATE =====
let current = 0;
let answers = {};   // id -> nilai (teks untuk identitas, angka 1–5 untuk pernyataan)
let others = {};    // id -> teks isian "Lainnya"

// ===== HELPER =====
function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function updateProgress() {
  const n = Object.keys(answers).length;
  document.getElementById('count').textContent = n + '/' + TOTAL_Q + ' dijawab';
  document.getElementById('bar').style.width = (n / TOTAL_Q * 100) + '%';
}

function clearError(card) {
  card.classList.remove('error');
  const m = card.querySelector('.err-msg');
  if (m) m.hidden = true;
}

// ===== KOMPONEN =====
function coverCard() {
  return el(`<div class="card cover">
    <img class="cover-logo" src="${LOGO}" alt="Logo Sosialisasi IKD Desa Sukajaya">
    <span class="tag">KUESIONER PENELITIAN</span>
    <h1>Kuesioner Penelitian</h1>
    <div class="sub">Sosialisasi Aplikasi Identitas Kependudukan Digital (IKD) – Desa Sukajaya</div>
    <p>Terima kasih telah bersedia mengisi kuesioner ini. Jawaban Anda bersifat rahasia dan hanya digunakan untuk keperluan penelitian. Pengisian membutuhkan waktu sekitar 5 menit.</p>
    <div class="req-note"><span style="color:#FCA5A5">*</span> Wajib diisi</div>
  </div>`);
}

function headCard(eyebrow, title, desc) {
  return el(`<div class="card sec-head">
    <div class="eyebrow">${eyebrow}</div>
    <h2>${title}</h2>
    ${desc ? `<p>${desc}</p>` : ''}
  </div>`);
}

function petunjukCard() {
  return el(`<div class="card info">
    <h3>Petunjuk pengisian</h3>
    <p>Berikan tanda pada salah satu jawaban yang sesuai dengan pendapat atau pengalaman Anda.</p>
    <div class="legend">${LIKERT.map(l => `<span><b>${l.code}</b> = ${l.label}</span>`).join('')}</div>
  </div>`);
}

function identityCard(q) {
  const card = el(`<div class="card q" data-id="${q.id}">
    <div class="q-top"><span class="num">${q.no}</span><p class="q-text">${q.text} <span class="req">*</span></p></div>
    <div class="choices" role="radiogroup">
      ${q.options.map(o => `<label class="choice"><input type="radio" name="${q.id}" value="${o}"${answers[q.id] === o ? ' checked' : ''}><span>${o}</span></label>`).join('')}
    </div>
    ${q.other ? `<div class="other${answers[q.id] === 'Lainnya' ? ' show' : ''}"><input type="text" maxlength="80" placeholder="Sebutkan..." aria-label="Isian lainnya"></div>` : ''}
    <p class="err-msg" hidden></p>
  </div>`);

  const otherWrap = card.querySelector('.other');
  const otherInput = card.querySelector('.other input');
  if (otherInput) otherInput.value = others[q.id] || '';

  card.addEventListener('change', e => {
    if (e.target.type !== 'radio') return;
    answers[q.id] = e.target.value;
    if (otherWrap) {
      const isOther = e.target.value === 'Lainnya';
      otherWrap.classList.toggle('show', isOther);
      if (isOther) otherInput.focus();
    }
    clearError(card);
    updateProgress();
  });
  if (otherInput) {
    otherInput.addEventListener('input', () => { others[q.id] = otherInput.value; clearError(card); });
  }
  return card;
}

function likertCard(item) {
  const card = el(`<div class="card q" data-id="${item.id}">
    <div class="q-top"><span class="num">${item.no}</span><p class="q-text">${item.text} <span class="req">*</span></p></div>
    <div class="likert" role="radiogroup">
      ${LIKERT.map(l => `<label><input type="radio" name="${item.id}" value="${l.v}"${answers[item.id] === l.v ? ' checked' : ''}><span class="tile"><b>${l.code}</b><span>${l.label}</span></span></label>`).join('')}
    </div>
    <p class="err-msg" hidden>Pertanyaan ini wajib diisi.</p>
  </div>`);

  // Menjawab TIDAK me-render ulang halaman, jadi posisi scroll tidak berubah.
  card.addEventListener('change', e => {
    if (e.target.type !== 'radio') return;
    answers[item.id] = Number(e.target.value);
    clearError(card);
    updateProgress();
  });
  return card;
}

function navEl() {
  const last = current === SECTIONS.length - 1;
  const nav = el(`<div>
    <div class="nav"></div>
    <div class="step">Bagian ${current + 1} dari ${SECTIONS.length}</div>
    <div class="submit-err" id="submit-err" hidden></div>
  </div>`);
  const row = nav.querySelector('.nav');
  if (current > 0) {
    const prev = el('<button type="button" class="btn btn-ghost">← Sebelumnya</button>');
    prev.onclick = goPrev;
    row.appendChild(prev);
  }
  const next = el(last
    ? '<button type="button" class="btn btn-submit">Kirim ✓</button>'
    : '<button type="button" class="btn btn-primary">Berikutnya →</button>');
  next.onclick = last ? () => submitForm(next) : goNext;
  row.appendChild(next);
  return nav;
}

  const root = document.getElementById('content');
  root.innerHTML = '';

  if (sec.type === 'identity') {
    root.appendChild(coverCard());
    root.appendChild(headCard('A. IDENTITAS RESPONDEN', 'Identitas Responden', 'Mohon isi data berikut dengan benar.'));
    IDENTITY.forEach(q => root.appendChild(identityCard(q)));
  } else {
    root.appendChild(headCard('B. PERNYATAAN KUESIONER', (sec.gi + 1) + '. ' + sec.group.title));
    if (sec.gi === 0) root.appendChild(petunjukCard());
    sec.group.items.forEach(it => root.appendChild(likertCard(it)));
  }
  root.appendChild(navEl());
  updateProgress();
}

// ===== VALIDASI =====
function validateCurrent() {
  const sec = SECTIONS[current];
  const qs = sec.type === 'identity' ? IDENTITY : sec.group.items;
  let first = null;
  qs.forEach(q => {
    const card = document.querySelector('[data-id="' + q.id + '"]');
    let ok = answers[q.id] !== undefined;
    let msg = 'Pertanyaan ini wajib diisi.';
    if (ok && q.other && answers[q.id] === 'Lainnya' && !(others[q.id] || '').trim()) {
      ok = false;
      msg = 'Mohon sebutkan jawaban Anda pada kolom "Lainnya".';
    }
    if (!ok) {
      card.classList.add('error');
      const m = card.querySelector('.err-msg');
      m.textContent = msg;
      m.hidden = false;
      if (!first) first = card;
    }
  });
  if (first) {
    first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return false;
  }
  return true;
}

// ===== NAVIGASI =====
// Scroll ke atas HANYA terjadi saat pindah bagian, bukan saat menjawab.
function goNext() {
  if (!validateCurrent()) return;
  current++;
  renderSection();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function goPrev() {
  current--;
  renderSection();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===== KIRIM =====
function withOther(id) {
  return answers[id] === 'Lainnya' ? 'Lainnya: ' + (others[id] || '').trim() : answers[id];
}

async function submitForm(btn) {
  if (!validateCurrent()) return;
  const errBox = document.getElementById('submit-err');
  errBox.hidden = true;
  btn.disabled = true;
  btn.textContent = 'Mengirim…';

  const payload = {
    timestamp: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }),
    jenis_kelamin: answers.jk,
    usia: answers.usia,
    pekerjaan: withOther('pekerjaan')
  };
  GROUPS.forEach(g => g.items.forEach(it => { payload['P' + it.no] = answers[it.id]; }));

  try {
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_') === 0) {
      console.warn('APPS_SCRIPT_URL belum diisi — jawaban TIDAK tersimpan ke mana pun.', payload);
    } else {
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
    }
    showThanks();
  } catch (e) {
    errBox.textContent = 'Jawaban gagal terkirim. Periksa koneksi internet Anda lalu coba lagi.';
    errBox.hidden = false;
    btn.disabled = false;
    btn.textContent = 'Kirim ✓';
  }
}

function showThanks() {
  document.getElementById('content').hidden = true;
  document.getElementById('thanks').hidden = false;
  document.getElementById('count').textContent = TOTAL_Q + '/' + TOTAL_Q + ' dijawab';
  document.getElementById('bar').style.width = '100%';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetForm() {
  answers = {};
  others = {};
  current = 0;
  document.getElementById('thanks').hidden = true;
  document.getElementById('content').hidden = false;
  renderSection();
  window.scrollTo({ top: 0 });
}

renderSection();
</script>
</body>
